name: Keep Supabase alive

on:
  schedule:
    - cron: "17 6 */3 * *"   # hver 3. dag
  workflow_dispatch:          # så kan køre den manuelt

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hent én kamp fra Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/matches?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
